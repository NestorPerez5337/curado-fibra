<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>HMI Curado Fibra</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #eee; margin: 0; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(2, 280px); gap: 15px; justify-content: center; padding: 30px; }
        .btn-dev { padding: 25px; cursor: pointer; background: #222; color: #fff; border: 1px solid #444; border-radius: 8px; font-weight: bold; }
        .btn-dev:hover { border-color: #007bff; background: #2a2a2a; }
        
        #login-screen { position: fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:2000; display:flex; justify-content:center; align-items:center; }

        /* Menú principal: botones grandes por sección, con buscador. Hace scroll
           si la pantalla es baja, así no se corta ningún acceso. */
        #menu-screen { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#121212; z-index:2000; overflow-y:auto; }
        .menu-contenedor { max-width:1100px; margin:0 auto; padding:24px 20px 40px; text-align:left; }
        .menu-cabecera { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
        .menu-cabecera h2 { margin:0; color:#007bff; font-size:22px; }
        .menu-usuario { display:flex; align-items:center; gap:12px; color:#aaa; font-size:14px; }
        .btn-salir { padding:9px 16px; background:#dc3545; color:#fff; border:none; border-radius:4px; font-weight:bold; font-size:14px; cursor:pointer; }
        #menu-buscar { width:100%; box-sizing:border-box; padding:13px 14px; font-size:15px; background:#1f1f1f; color:#fff; border:1px solid #333; border-radius:8px; }
        #menu-buscar:focus { outline:none; border-color:#007bff; }
        .menu-seccion-titulo { font-size:13px; color:#8a8a8a; margin:24px 0 10px; }
        .menu-tiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:14px; }
        .tile-menu { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:26px 12px; background:#1f1f1f; color:#fff; border:1px solid #333; border-top:4px solid var(--color); border-radius:8px; font-family:inherit; font-size:15px; font-weight:bold; text-align:center; text-decoration:none; cursor:pointer; }
        .tile-menu .icono { display:flex; color:var(--color); }
        .tile-menu .icono svg { width:36px; height:36px; }
        .tile-menu:hover { background:#2a2a2a; border-color:var(--color); }
        .menu-chips { display:flex; flex-wrap:wrap; gap:10px; }
        .chip-menu { display:inline-flex; align-items:center; gap:8px; padding:13px 16px; background:#1f1f1f; color:#fff; border:1px solid #7a6212; border-radius:6px; font-family:inherit; font-size:14px; text-decoration:none; cursor:pointer; }
        .chip-menu .icono { display:flex; color:var(--color); }
        .chip-menu .icono svg { width:18px; height:18px; }
        .chip-menu:hover { background:#2a2a2a; border-color:#ffc107; }
        .tile-menu:focus-visible, .chip-menu:focus-visible, .btn-salir:focus-visible { outline:2px solid #fff; outline-offset:2px; }
        .menu-vacio { color:#888; font-size:14px; margin:30px 0; text-align:center; }
        @media (max-width:520px) {
            .menu-tiles { grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px; }
            .tile-menu { padding:20px 8px; font-size:14px; }
        }
        #panel-devanadoras { display:none; }
        .btn-volver { background:#444; color:white; border:none; border-radius:4px; padding:8px 14px; cursor:pointer; font-weight:bold; margin:15px; }
        .modal { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#1f1f1f; padding:20px; border-radius:10px; border:2px solid #007bff; z-index:1000; width:880px; }
        .overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:500; }
        
        .form-grid { display:grid; grid-template-columns: 1fr 1fr; gap:8px; flex:2; }
        .campo { background:#2a2a2a; padding:6px; border-radius:4px; text-align:left; font-size:0.85em; }
        .val-act { color:#0f0; font-family:monospace; margin-right:8px; background:#000; padding:2px 4px; }
        input { background:#000; color:#fff; border:1px solid #444; padding:4px; width:65px; }

        .sidebar { flex:1; background:#111; padding:15px; border-radius:8px; display:flex; flex-direction:column; }
        button.accion { width:100%; padding:12px; margin-top:10px; cursor:pointer; font-weight:bold; border:none; border-radius:4px; }
        .btn-green { background:#28a745; color:white; }
        .btn-red { background:#dc3545; color:white; }
        .btn-blue { background:#0056b3; color:white; }
    </style>
</head>
<body>

    <div id="login-screen">
    <div style="background: #1f1f1f; padding: 30px; border-radius: 10px; border: 2px solid #333; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 320px;">
        <h2 style="color: #007bff; margin-bottom: 20px; font-family: sans-serif; font-size: 22px;">SISTEMA DE CONTROL</h2>
        
        <div style="display: flex; flex-direction: column; gap: 12px; align-items: center; margin-bottom: 20px;">
            <input type="text" id="u" placeholder="Usuario" style="padding: 10px; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 4px; width: 80%; text-align: center; font-size: 15px;">
            <input type="password" id="p" placeholder="Contraseña" style="padding: 10px; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 4px; width: 80%; text-align: center; font-size: 15px;">
            <button onclick="login()" style="padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; width: 87%; margin-top: 5px; font-size: 15px;">
                Ingresar al Sistema
            </button>
        </div>

        <div id="msg-login" style="color:#dc3545; font-size:13px; margin-top:10px;"></div>
    </div>
</div>

    <div id="menu-screen">
        <div class="menu-contenedor">
            <div class="menu-cabecera">
                <h2>SISTEMA DE CONTROL</h2>
                <div class="menu-usuario">
                    <span id="menu-usuario"></span>
                    <button type="button" class="btn-salir" onclick="logout()">Cerrar sesión</button>
                </div>
            </div>

            <input type="search" id="menu-buscar" placeholder="Buscar sección…" autocomplete="off" aria-label="Buscar sección" oninput="renderMenu()" onkeydown="teclaBuscador(event)">

            <div id="menu-secciones"></div>
        </div>
    </div>

    <div id="panel-devanadoras">
    <button class="btn-volver" onclick="volverMenu()">&larr; Volver al menú</button>
    <h1>CONTROL DE CURADO - FIBRA</h1>
    <div class="grid" id="container"></div>

    <div class="overlay" onclick="cerrar()"></div>
    <div class="modal" id="modal">
        <h2 id="m-tit" style="color:#007bff; margin-top:0;"></h2>
        <select id="sel-rec" style="width:100%; padding:10px; background:#333; color:white;" onchange="cargarR(this.value)">
            <option value="">-- Cargar Receta Guardada --</option>
        </select>
        <button class="accion btn-blue" onclick="copiar()">⬇ COPIAR VALORES ACTUALES DEL PLC A EDICIÓN</button>
        
        <div style="display:flex; gap:15px; margin-top:15px;">
            <div class="form-grid" id="f-grid"></div>
            <div class="sidebar">
                <div style="text-align:left; font-size:0.9em; margin-bottom:15px;">
                    T.Total: <b id="total" style="color:#ffc107; float:right;">0 min</b>
                </div>
                <div style="text-align:left; font-size:0.9em; margin-bottom:15px;">
                    T.Curado: <b id="total2" style="color:#ffc107; float:right;">0 min</b>
                </div>
                <div style="text-align:left; font-size:0.9em; margin-bottom:15px;">
                    T.Enfriamiento: <b id="total3" style="color:#ffc107; float:right;">0 min</b>
                </div>
                <button class="accion btn-green" onclick="setear()">SETEAR ESTE CANAL</button>
                <button class="accion btn-red" onclick="setearTodo()">⚠️ SETEAR EN TODAS (LAS 6)</button>
                <hr style="width:100%; border:0; border-top:1px solid #070202; margin:15px 0;">
                <input type="text" id="nom-r" placeholder="Nombre receta..." style="width:90%;">
                <button class="accion" onclick="guardarR()" style="background:#17a2b8; color:white;">GUARDAR RECETA</button>
                <button class="accion" onclick="eliminarR()" style="background:#dc3545; color:white;">🗑 ELIMINAR RECETA</button>
                <button class="accion" onclick="cerrar()" style="background:#444; color:white; margin-top:15px;">CERRAR</button>
            </div>
        </div>
    </div>
    </div>

    <script>
        const campos = [
            {id:'t1', n:'T1: T. Barrido de Condensado'}, {id:'t2', n:'T2: Inyecc. de Curado'}, {id:'t3', n:'T3: Despre. de Inyeccion'},
            {id:'t4', n:'T4: Baja Presion Curado'}, {id:'t5', n:'T5: Media Presion Curado'}, {id:'t6', n:'T6: Alta Precion Curado'},
            {id:'t7', n:'T7: Despres.'}, {id:'t8', n:'T8: Barr. Vap.'}, {id:'t9', n:'T9: Enfri. Ag.'},
            {id:'t10', n:'T10: Barr. Ag.'}, {id:'t11', n:'T11: Iny. Desm.'}, {id:'t12', n:'T12: Enfriam.'},
            {id:'t13', n:'T13: Barr. Enf.'}, {id:'ti', n:'TI: Retardo de Apertura'}, {id:'tp', n:'TP: Apertura de Purga'},
            {id:'td', n:'TD: Ciclo P.'}, {id:'pot_macho', n:'% Pot. M'}, {id:'pot_hembra', n:'% Pot. H'}, {id:'te', n:'TE: Extrac.'}
        ];

        let devA, canA, recetas = [];

        for(let d=1; d<=6; d++) {
            for(let c=1; c<=2; c++) {
                document.getElementById('container').innerHTML += `<button class="btn-dev" onclick="abrir(${d},${c})">DEV ${d} | CANAL ${c}</button>`;
            }
        }

        campos.forEach(c => {
           document.getElementById('f-grid').innerHTML += `<div class="campo"><label style="color:#007bff; display:block;">${c.n}</label>
    <span class="val-act" id="act-${c.id}">--</span><input type="number" id="inp-${c.id}" oninput="calc(); calc2();calc3();"></div>`;
        });

        let yo = null;

        // Si la sesión venció mientras se estaba usando el panel de
        // devanadoras, volvemos al login. Excluimos /api/login (su propio
        // 401 es "contraseña incorrecta", no sesión vencida) y /api/me
        // (initSesion ya maneja su 401 mostrando el login normalmente;
        // si no la excluyéramos, un visitante sin sesión entraría en un
        // bucle de recargas).
        (function () {
            const fetchOriginal = window.fetch;
            window.fetch = async function (...args) {
                const res = await fetchOriginal(...args);
                const url = String(args[0]);
                if (res.status === 401 && url !== '/api/login' && url !== '/api/me') {
                    window.location.href = '/';
                }
                return res;
            };
        })();

        async function login() {
            const msg = document.getElementById('msg-login');
            msg.innerText = '';
            const res = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({user:document.getElementById('u').value, pass:document.getElementById('p').value}) });
            if(!res.ok) { msg.innerText = 'Usuario o contraseña incorrectos'; return; }

            const rMe = await fetch('/api/me');
            yo = await rMe.json();

            document.getElementById('login-screen').style.display = 'none';
            mostrarMenu();
        }

        // Iconos del menú: Tabler Icons (estilo "outline", licencia MIT,
        // https://tabler.io/icons) pegados acá como SVG para que la pantalla no
        // dependa de internet. Para usar otro, copiar su SVG y agregarlo a la lista.
        const ICONOS = {
            'adjustments-horizontal': '<path d="M14 6m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M4 6l8 0"/><path d="M16 6l4 0"/><path d="M8 12m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M4 12l2 0"/><path d="M10 12l10 0"/><path d="M17 18m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M4 18l11 0"/><path d="M19 18l1 0"/>',
            'clock-hour-4': '<path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path d="M12 12l3 2"/><path d="M12 7v5"/>',
            'file-description': '<path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z"/><path d="M9 17h6"/><path d="M9 13h6"/>',
            'chart-line': '<path d="M4 19l16 0"/><path d="M4 15l4 -6l4 2l4 -5l4 4"/>',
            'wind': '<path d="M5 8h8.5a2.5 2.5 0 1 0 -2.34 -3.24"/><path d="M3 12h15.5a2.5 2.5 0 1 1 -2.34 3.24"/><path d="M4 16h5.5a2.5 2.5 0 1 1 -2.34 3.24"/>',
            'history': '<path d="M12 8l0 4l2 2"/><path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"/>',
            'bolt': '<path d="M13 3l0 7l6 0l-8 11l0 -7l-6 0l8 -11"/>',
            'activity': '<path d="M3 12h4l3 8l4 -16l3 8h4"/>',
            'server': '<path d="M3 4m0 3a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3z"/><path d="M3 12m0 3a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3z"/><path d="M7 8l0 .01"/><path d="M7 16l0 .01"/>',
            'users': '<path d="M9 7m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"/><path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0 -3 -3.85"/>',
            'list-details': '<path d="M13 5h8"/><path d="M13 9h5"/><path d="M13 15h8"/><path d="M13 19h5"/><path d="M3 4m0 1a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z"/><path d="M3 14m0 1a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z"/>'
        };

        function iconoSvg(nombre) {
            return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONOS[nombre] || ''}</svg>`;
        }

        // Secciones del menú. Para sumar un acceso nuevo alcanza con agregar
        // una línea acá: "permiso" es el permiso del usuario que lo habilita
        // (el administrador ve todo) y las secciones con "admin" son solo
        // para administradores. Con "url" abre esa pantalla; con "accion"
        // llama a esa función de esta misma página. "icono" es una clave de ICONOS.
        const MENU = [
            { seccion: 'Producción', color: '#3b9bff', items: [
                { icono: 'adjustments-horizontal', titulo: 'Control de Devanadoras', permiso: 'devanadoras', accion: 'abrirDevanadoras' },
                { icono: 'clock-hour-4', titulo: 'Horómetros', permiso: 'horometros', url: '/horometros' }
            ] },
            { seccion: 'Ensayos', color: '#a78bfa', items: [
                { icono: 'file-description', titulo: 'Visor de Ensayos', permiso: 'visor', url: '/visor' },
                { icono: 'chart-line', titulo: 'Visor de Ensayos PH', permiso: 'visor', url: '/visor-ph' }
            ] },
            { seccion: 'Compresores y energía', color: '#2dd4bf', items: [
                { icono: 'wind', titulo: 'Compresores', permiso: 'compresores', url: '/compresores' },
                { icono: 'history', titulo: 'Historial de Compresores', permiso: 'compresores', url: '/compresores/historial' },
                { icono: 'bolt', titulo: 'Consumos de Energía', permiso: 'energia', url: '/energia' }
            ] },
            { seccion: 'Administración', admin: true, color: '#ffc107', items: [
                { icono: 'activity', titulo: 'Monitor de Variables', url: '/monitor' },
                { icono: 'server', titulo: 'Estado del Sistema', url: '/estado' },
                { icono: 'users', titulo: 'Administración de Usuarios', url: '/admin' },
                { icono: 'list-details', titulo: 'Registro de Cambios', url: '/log' }
            ] }
        ];

        // Sin tildes y en minúsculas, para que "energia" encuentre "Energía"
        const normalizar = texto => String(texto).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

        function puedeVer(seccion, item) {
            return seccion.admin ? yo.esAdmin : (yo.esAdmin || !!yo.permisos[item.permiso]);
        }

        function elementoMenu(item, clase, color) {
            const contenido = `<span class="icono">${iconoSvg(item.icono)}</span><span>${item.titulo}</span>`;
            const estilo = `--color:${color}`;

            return item.url
                ? `<a class="${clase}" style="${estilo}" href="${item.url}">${contenido}</a>`
                : `<button type="button" class="${clase}" style="${estilo}" onclick="${item.accion}()">${contenido}</button>`;
        }

        function renderMenu() {
            const filtro = normalizar(document.getElementById('menu-buscar').value.trim());
            let html = '';
            let habilitados = 0;
            let visibles = 0;

            MENU.forEach(seccion => {
                const permitidos = seccion.items.filter(item => puedeVer(seccion, item));
                habilitados += permitidos.length;

                const items = filtro
                    ? permitidos.filter(item => normalizar(item.titulo).includes(filtro))
                    : permitidos;

                if (items.length === 0) return;
                visibles += items.length;

                html += `<div class="menu-seccion-titulo">${seccion.seccion}${seccion.admin ? ' · solo administradores' : ''}</div>`;

                html += seccion.admin
                    ? `<div class="menu-chips">${items.map(item => elementoMenu(item, 'chip-menu', seccion.color)).join('')}</div>`
                    : `<div class="menu-tiles">${items.map(item => elementoMenu(item, 'tile-menu', seccion.color)).join('')}</div>`;
            });

            if (habilitados === 0) {
                html = '<div class="menu-vacio">Todavía no tenés secciones asignadas. Pedile a un administrador que te dé permisos.</div>';
            } else if (visibles === 0) {
                html = '<div class="menu-vacio">No hay secciones que coincidan con la búsqueda.</div>';
            }

            document.getElementById('menu-secciones').innerHTML = html;
        }

        // Enter abre la primera sección que quedó a la vista; Escape borra la búsqueda.
        function teclaBuscador(evento) {
            if (evento.key === 'Escape') {
                evento.target.value = '';
                renderMenu();
            } else if (evento.key === 'Enter') {
                const primero = document.querySelector('#menu-secciones .tile-menu, #menu-secciones .chip-menu');
                if (primero) primero.click();
            }
        }

        function mostrarMenu() {
            document.getElementById('menu-usuario').innerText = `Usuario: ${yo.usuario}`;
            document.getElementById('menu-buscar').value = '';
            renderMenu();

            document.getElementById('panel-devanadoras').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'block';
        }

        // Si ya había una sesión iniciada (por ejemplo, volviendo con el
        // botón "atrás" del navegador desde otra pantalla), vamos directo
        // al menú en vez de mostrar el login de nuevo.
        (async function initSesion() {

            try {

                const res = await fetch('/api/me');

                if (res.ok) {
                    yo = await res.json();
                    document.getElementById('login-screen').style.display = 'none';
                    mostrarMenu();
                }

            } catch (e) {}
        })();

        function abrirDevanadoras() {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('panel-devanadoras').style.display = 'block';
        }

        function volverMenu() {
            document.getElementById('panel-devanadoras').style.display = 'none';
            mostrarMenu();
        }

        async function logout() {
            await fetch('/api/logout', { method:'POST' });
            window.location.reload();
        }

        async function abrir(d, c) {
            devA = d; canA = c;
            document.getElementById('m-tit').innerText = `DEV ${d} - CANAL ${c}`;
            document.getElementById('modal').style.display = 'block';
            document.querySelector('.overlay').style.display = 'block';
            refrescar();
            const r = await fetch('/api/recetas'); recetas = await r.json();
            const sel = document.getElementById('sel-rec');
            sel.innerHTML = '<option value="">-- Cargar Receta --</option>';
            recetas.forEach(x => sel.innerHTML += `<option value="${x.id}">${x.nombre}</option>`);
        }

        async function refrescar() {
            const res = await fetch(`/api/leer-plc?dev=${devA}&canal=${canA}`);
            if(res.ok) {
                const d = await res.json();
                campos.forEach(c => document.getElementById(`act-${c.id}`).innerText = d[c.id]);
            }
        }

        function copiar() {
            campos.forEach(c => { const v = document.getElementById(`act-${c.id}`).innerText; if(v !== "--") document.getElementById(`inp-${c.id}`).value = v; });
            calc();
            calc2();
            calc3();
        }

        function calc() {
            let total = 0;
            campos.forEach(c => { if(['t1','t2','t3','t4','t5','t6','t7','t8','t9','t10','t11','t12','t13'].includes(c.id)) total += parseFloat(document.getElementById(`inp-${c.id}`).value) || 0; });
            document.getElementById('total').innerText = ((total/60).toFixed(1)) + " min";
        }
        function calc2() {
            let total2 = 0;
            campos.forEach(c => { if(['t2','t3','t4','t5','t6','t7','t8','t9','t10'].includes(c.id)) total2 += parseFloat(document.getElementById(`inp-${c.id}`).value) || 0; });
            document.getElementById('total2').innerText = ((total2/60).toFixed(1)) + " min";
        }
        function calc3() {
            let total3 = 0;
            campos.forEach(c => { if(['t11','t12','t13'].includes(c.id)) total3 += parseFloat(document.getElementById(`inp-${c.id}`).value) || 0; });
            document.getElementById('total3').innerText = ((total3/60).toFixed(1)) + " min";
        }

        async function setear() {
            const valores = {};
            campos.forEach(c => { const v = document.getElementById(`inp-${c.id}`).value; if(v !== "") valores[c.id] = v; });
            const res = await fetch('/api/setear-plc', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({dev:devA, canal:canA, valores}) });
            if (res.ok) {
                alert("Enviado."); setTimeout(refrescar, 600);
            } else {
                alert("Error: no se pudo enviar la receta al PLC. Revisá la conexión con la máquina e intentá de nuevo.");
            }
        }

        async function setearTodo() {
    if(!confirm("¿Estás seguro de enviar esta receta a las 6 máquinas (se aplicará en el CANAL 1 y CANAL 2 de todas)?")) return;
    
    const valores = {};
    campos.forEach(c => { 
        const v = document.getElementById(`inp-${c.id}`).value; 
        if(v !== "") valores[c.id] = v; 
    });
    
    // Enviamos solo los valores de la receta
    const res = await fetch('/api/setear-todas', { 
        method: 'POST', 
        headers: { 'Content-Type': 'application/json' }, 
        body: JSON.stringify({ valores }) 
    });
    
    if (res.ok) {
        const data = await res.json().catch(() => ({}));
        if (data.fallos && data.fallos.length > 0) {
            alert(`Atención: no se pudo escribir la receta en la(s) máquina(s) ${data.fallos.join(', ')}. ` +
                `El resto se grabó correctamente. Revisá esas máquinas antes de continuar.`);
        } else {
            alert("Receta grabada con éxito en todos los canales (1 y 2) de las 6 máquinas.");
        }
        setTimeout(refrescar, 600);
    } else {
        alert("Hubo un error en el servidor al intentar procesar el envío masivo total.");
    }
}

            if(r) { campos.forEach(c => document.getElementById(`inp-${c.id}`).value = r.valores[c.id]); calc();calc2();calc3(); }

        async function guardarR() {

    const valores = {};

    campos.forEach(c => {

        valores[c.id] =
            document.getElementById(`inp-${c.id}`).value;
    });

    const nombre =
        document.getElementById('nom-r').value;

    if (!nombre) {

        alert('Ingresá un nombre');

        return;
    }

    const res = await fetch('/api/recetas', {

        method: 'POST',

        headers: {
            'Content-Type': 'application/json'
        },

        body: JSON.stringify({
            nombre,
            valores
        })
    });

    if (!res.ok) {

        alert('Error guardando receta');

        return;
    }

    alert('Receta guardada');

    // =========================================
    // RECARGAR RECETAS AUTOMÁTICAMENTE
    // =========================================

    const r = await fetch('/api/recetas');

    recetas = await r.json();

    const sel =
        document.getElementById('sel-rec');

    sel.innerHTML =
        '<option value="">-- Cargar Receta --</option>';

    recetas.forEach(x => {

        sel.innerHTML +=
            `<option value="${x.id}">
                ${x.nombre}
             </option>`;
    });

    // limpiar nombre
    document.getElementById('nom-r').value = '';
}
        async function eliminarR() {

    const id =
        document.getElementById('sel-rec').value;

    if (!id) {

        alert('Seleccioná una receta');

        return;
    }

    if (!confirm('¿Eliminar receta?')) {
        return;
    }

    const res = await fetch(
        `/api/recetas/${id}`,
        {
            method: 'DELETE'
        }
    );

    if (res.ok) {

        alert('Receta eliminada');

        abrir(devA, canA);

    } else {

        alert('Error eliminando receta');
    }
}
