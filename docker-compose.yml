version: '3.9'

services:
  curado-fibra:

    container_name: curado-fibra

    build: .

    restart: unless-stopped

    ports:
      - "3010:3000"

    volumes:
      - datos_curado_fibra:/app/data
      - pdfs_curado_fibra:/app/pdfs
      - backups_curado_fibra:/app/backups

    environment:
      TZ: America/Argentina/Buenos_Aires
      ADMIN_USER: admin
      ADMIN_PASS: 1234
      SESSION_SECRET: clave_super_secreta_2026
      PORT: 3000
      # Visor de Ensayos PH (SQL Server, solo lectura). La contraseña NO va
      # acá: se carga en Portainer -> Stacks -> curado-fibra -> Environment
      # variables, con el nombre PH_SQL_PASSWORD.
      PH_SQL_SERVER: ${PH_SQL_SERVER:-10.106.100.15}
      PH_SQL_INSTANCE: ${PH_SQL_INSTANCE:-automatizacion}
      PH_SQL_DATABASE: ${PH_SQL_DATABASE:-Automatizacion}
      PH_SQL_USER: ${PH_SQL_USER:-portal_lectura}
      PH_SQL_PASSWORD: ${PH_SQL_PASSWORD:-}
      # Guardado de los ensayos de presión (SQL Server, con escritura). Usa el
      # mismo servidor y base de arriba. La contraseña NO va acá: se carga en
      # Portainer -> Stacks -> curado-fibra -> Environment variables, con el
      # nombre ENSAYOS_SQL_PASSWORD. Sin estas variables los ensayos se guardan
      # igual en la base local y quedan pendientes de subir.
      ENSAYOS_SQL_USER: ${ENSAYOS_SQL_USER:-}
      ENSAYOS_SQL_PASSWORD: ${ENSAYOS_SQL_PASSWORD:-}

volumes:
  datos_curado_fibra:
  pdfs_curado_fibra:
  backups_curado_fibra:
