<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor de Ensayos PH</title>
<script src="/ph-assets/chart.min.js"></script>
<script src="/ph-assets/hammer.min.js"></script>
<script src="/ph-assets/chartjs-plugin-zoom.min.js"></script>
<script src="/ph-assets/chartjs-plugin-annotation.min.js"></script>
<script src="/ph-assets/grafico.js"></script>
<link rel="stylesheet" href="/ph-assets/flatpickr-dark.css">
<script src="/ph-assets/flatpickr.min.js"></script>
<script src="/ph-assets/flatpickr-es.js"></script>
<style>
:root{ --bg:#111; --panel:#1a1a1a; --panel2:#222; --borde:#333; --texto:#eee; --tenue:#999; --acento:#00bfff; --error:#ff6b6b; }
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--texto);}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--borde)}
header a{color:var(--acento);text-decoration:none;font-weight:bold}
header h1{font-size:20px;margin:0;flex:1}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid #444;background:var(--panel2);color:var(--texto);padding:8px 14px}
button:hover{border-color:var(--acento)}
button.primario{background:var(--acento);color:#001018;border-color:var(--acento);font-weight:bold}
button:disabled{opacity:.55;cursor:not-allowed}
.filtros{display:flex;flex-wrap:wrap;gap:12px;align-items:end;padding:14px 20px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--tenue);gap:4px}
input,select{background:var(--panel2);color:var(--texto);border:1px solid #444;border-radius:6px;padding:8px;font:inherit;min-width:110px}
select:disabled,input:disabled{opacity:.5}
#ensayo{min-width:230px}
.chk{flex-direction:row;align-items:center;gap:6px;font-size:14px;color:var(--texto);padding-bottom:8px}
.chk input{min-width:0}
.espacio{flex:1}
.aviso{margin:0 20px 10px;padding:10px 14px;border-radius:6px;background:#3a1d1d;color:var(--error);display:none}
.tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px;padding:0 20px}
.tarjeta{background:var(--panel);border:1px solid var(--borde);border-radius:8px;padding:10px 12px}
.tarjeta small{display:block;color:var(--tenue);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.tarjeta b{font-size:17px;white-space:nowrap}
.tarjeta .ayuda{font-weight:normal}
.grafico{margin:12px 20px 20px;background:var(--panel);border:1px solid var(--borde);border-radius:8px;padding:12px 16px}
.grafico .barra{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.grafico h2{font-size:16px;margin:0;flex:1;min-width:200px}
.ayuda{font-size:12px;color:var(--tenue)}
.lienzo{position:relative;height:calc(100vh - 300px);min-height:360px}
.vacio{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--tenue);font-size:15px;text-align:center;padding:20px}
/* Descarga masiva */
#btnMasiva.activo{border-color:var(--acento);color:var(--acento)}
#btnMasiva.listo{background:#14532d;border-color:#3ecf6e;color:#bff5cf}
.fondo{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.fondo.abierto{display:flex}
.modal{background:var(--panel);border:1px solid #444;border-radius:10px;width:min(480px,100%);padding:20px;max-height:100%;overflow:auto}
.modal h3{margin:0 0 4px}
.modal .grilla{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.modal input{min-width:0;width:100%}
.conteo{background:var(--panel2);border-radius:6px;padding:10px;font-size:14px;margin-bottom:12px;min-height:38px}
.conteo.mal{color:var(--error)}
.progreso{display:none;margin:12px 0}
.progreso .pista{height:22px;background:#2a2a2a;border-radius:11px;overflow:hidden}
.progreso .relleno{height:100%;width:0;background:linear-gradient(90deg,#0088cc,var(--acento));transition:width .4s;
  display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:12px;font-weight:bold;color:#001018;min-width:34px}
.progreso p{margin:6px 0 0;font-size:13px;color:var(--tenue);line-height:1.4}
.acciones{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#mCancelar{border-color:#7a2e2e;color:#ff9b9b}
.ultimo{display:none;margin-top:12px;padding:10px;border-radius:6px;background:#14321f;border:1px solid #2b6b3f;font-size:13px;line-height:1.4}
.ultimo a{color:#7ee2a0;font-weight:bold;white-space:nowrap}
@media (max-width:700px){.lienzo{height:420px}}
</style>
</head>
<body>

<header>
  <a href="/">&larr; Menú</a>
  <h1>Visor de Ensayos PH</h1>
  <button id="btnMasiva">📦 Descarga masiva</button>
</header>

<div class="filtros">
  <label>Máquina <select id="maquina"></select></label>
  <label>OP <input id="op" list="listaOps" placeholder="Ej: 7414" autocomplete="off"></label>
  <datalist id="listaOps"></datalist>
  <label>Caño <select id="cano" disabled></select></label>
  <label>Ensayo <select id="ensayo" disabled></select></label>
  <label class="chk"><input type="checkbox" id="comparar" disabled> Superponer repeticiones</label>
  <span class="espacio"></span>
  <button class="primario" id="btnPdf" disabled title="Abre el informe en una pestaña nueva para guardarlo o imprimirlo">📄 Abrir PDF</button>
</div>

<div class="aviso" id="aviso"></div>

<div class="tarjetas" id="tarjetas"></div>

<div class="grafico">
  <div class="barra">
    <h2 id="titulo">&nbsp;</h2>
    <span class="ayuda">Arrastrá para hacer zoom · Ctrl + arrastrar para desplazar</span>
    <button id="btnReset">↺ Vista completa</button>
  </div>
  <div class="lienzo">
    <canvas id="chart"></canvas>
    <div class="vacio" id="vacio">Elegí una OP para empezar</div>
  </div>
</div>


<!-- Modal de descarga masiva -->
<div class="fondo" id="fondo">
  <div class="modal">
    <h3>Descarga masiva de PDFs</h3>
    <div class="ayuda" id="mMaquina">Completá al menos un filtro. Se genera un ZIP con un PDF por ensayo.</div>
    <div class="ultimo" id="mUltimo"></div>
    <div class="grilla">
      <label style="grid-column:span 2">OP <input id="mOp" list="listaOps" autocomplete="off"></label>
      <label>Fecha desde <input id="mDesde"></label>
      <label>Fecha hasta <input id="mHasta"></label>
      <label>Caño desde <input type="number" id="mCanoDesde" min="0"></label>
      <label>Caño hasta <input type="number" id="mCanoHasta" min="0"></label>
    </div>
    <div class="conteo" id="mConteo"></div>
    <div class="progreso" id="mProgreso">
      <div class="pista"><div class="relleno" id="mRelleno">0%</div></div>
      <p id="mDetalle"></p>
    </div>
    <div class="acciones">
      <button id="mCerrar">Cerrar</button>
      <button id="mCancelar" style="display:none">Cancelar generación</button>
      <button class="primario" id="mGenerar" disabled>GENERAR PDFs</button>
    </div>
  </div>
</div>

<script>
Chart.register(window.ChartZoom, window['chartjs-plugin-annotation']);
Chart.defaults.font.family = 'Arial, Helvetica, sans-serif';

const $ = id => document.getElementById(id);
const estado = { maquina: null, ensayos: [], cache: {} };
let chart = null;

// ---------- Utilidades ----------

// Con "cuerpo" hace un POST con JSON. Si falla, el error lleva los datos
// de la respuesta en err.datos.
async function api(url, cuerpo) {
  const r = await fetch(url, cuerpo === undefined ? undefined : {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo)
  });
  if (r.status === 401) { window.location.href = '/'; throw new Error('Sesión vencida'); }
  const datos = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(datos.error || 'Error consultando el servidor'); e.datos = datos; throw e; }
  return datos;
}

function mostrarError(err) {
  $('aviso').textContent = err ? err.message : '';
  $('aviso').style.display = err ? 'block' : 'none';
}

function opcion(valor, texto) {
  const o = document.createElement('option'); o.value = valor; o.textContent = texto; return o;
}

const diaMesHora = t => `${t.slice(8, 10)}/${t.slice(5, 7)} ${t.slice(11, 16)}`;
const fechaLarga = t => `${t.slice(8, 10)}/${t.slice(5, 7)}/${t.slice(0, 4)}`;
const num = v => v === null || v === undefined ? '—' : String(Math.round(v));

function actualizarUrl() {
  const p = new URLSearchParams();
  if (estado.maquina) p.set('maquina', estado.maquina);
  if ($('op').value.trim()) p.set('op', $('op').value.trim());
  if ($('cano').value) p.set('cano', $('cano').value);
  if ($('ensayo').value) p.set('ensayo', $('ensayo').value);
  history.replaceState(null, '', '/visor-ph?' + p.toString());
}

function limpiarDesde(paso) {
  if (paso <= 1) { $('cano').innerHTML = ''; $('cano').disabled = true; }
  if (paso <= 2) { $('ensayo').innerHTML = ''; $('ensayo').disabled = true; estado.ensayos = []; }
  $('comparar').checked = false; $('comparar').disabled = true;
  $('btnPdf').disabled = true;
  $('tarjetas').innerHTML = '';
  $('titulo').innerHTML = '&nbsp;';
  if (chart) { chart.destroy(); chart = null; }
  $('vacio').style.display = 'flex';
}

// ---------- Carga en cascada: máquina → OP → caño → ensayo ----------

async function cargarMaquinas(inicial) {
  const maquinas = await api('/api/ph/maquinas');
  maquinas.forEach(m => $('maquina').appendChild(opcion(m.clave, m.nombre)));
  if (inicial.maquina && maquinas.some(m => m.clave === inicial.maquina)) $('maquina').value = inicial.maquina;
  estado.maquina = $('maquina').value;
}

async function cargarOps() {
  $('listaOps').innerHTML = '';
  const ops = await api(`/api/ph/${estado.maquina}/ops`);
  ops.forEach(o => $('listaOps').appendChild(opcion(o.op, `${o.ensayos} ensayos · último ${diaMesHora(o.ultimo)}`)));
}

async function cargarCanos(canoInicial) {
  limpiarDesde(1);
  const op = $('op').value.trim();
  if (!op) { $('vacio').textContent = 'Elegí una OP para empezar'; actualizarUrl(); return; }

  const canos = await api(`/api/ph/${estado.maquina}/canos?op=${encodeURIComponent(op)}`);
  if (!canos.length) { $('vacio').textContent = `No hay ensayos para la OP ${op}`; actualizarUrl(); return; }

  canos.forEach(c => $('cano').appendChild(opcion(c.cano, c.ensayos > 1 ? `${c.cano}  (${c.ensayos} ensayos)` : c.cano)));
  $('cano').disabled = false;
  if (canoInicial && canos.some(c => c.cano === canoInicial)) $('cano').value = canoInicial;
  else $('cano').value = canos[canos.length - 1].cano;   // el último caño de la OP
  await cargarEnsayos();
}

async function cargarEnsayos(ensayoInicial) {
  limpiarDesde(2);
  const op = $('op').value.trim(), cano = $('cano').value;
  estado.ensayos = await api(`/api/ph/${estado.maquina}/ensayos?op=${encodeURIComponent(op)}&cano=${encodeURIComponent(cano)}`);

  if (!estado.ensayos.length) { $('vacio').textContent = 'Sin ensayos para ese caño'; actualizarUrl(); return; }

  estado.ensayos.forEach((e, i) => {
    const desde = e.inicio || e.fechaEnsayo;
    const extra = estado.ensayos.length > 1 && i === 0 ? ' (último)' : '';
    $('ensayo').appendChild(opcion(e.id, `${diaMesHora(desde)} — Ensayo ${e.id}${extra}`));
  });
  $('ensayo').disabled = false;
  $('comparar').disabled = estado.ensayos.length < 2;
  if (ensayoInicial && estado.ensayos.some(e => String(e.id) === String(ensayoInicial))) $('ensayo').value = ensayoInicial;
  await mostrar();
}

async function obtenerEnsayo(id) {
  const clave = `${estado.maquina}/${id}`;
  if (!estado.cache[clave]) estado.cache[clave] = await api(`/api/ph/${estado.maquina}/ensayos/${id}`);
  return estado.cache[clave];
}

// ---------- Dibujo ----------

function pintarTarjetas(e) {
  const r = e.resumen, u = e.unidad;
  const t = [
    ['OP', e.op],
    [e.cano2 ? 'Caños' : 'Caño', e.cano2 ? `${e.cano} y ${e.cano2}` : e.cano],
    ['Presión mín / máx', `${num(e.min)} / ${num(e.max)} ${u}`],
    ['Fecha', r ? fechaLarga(r.inicio) : fechaLarga(e.fechaEnsayo)],
    ['Inicio – fin', r ? `${r.inicio.slice(11, 19)} – ${r.fin.slice(11, 19)}` : '—'],
    ['Duración', r ? GraficoPH.mmss(r.duracionSeg) : '—'],
    ['Pico alcanzado', r ? [`${num(r.pico.p)} ${u}`, r.pico.t.slice(11, 19)] : '—'],
    ['Tiempo ≥ mínima', r && r.segSobreMin !== null ? GraficoPH.mmss(r.segSobreMin) : '—'],
  ];
  $('tarjetas').innerHTML = '';
  t.forEach(([k, v]) => {
    const d = document.createElement('div'); d.className = 'tarjeta';
    const s = document.createElement('small'); s.textContent = k;
    const b = document.createElement('b');
    if (Array.isArray(v)) {
      b.textContent = v[0] + ' ';
      const a = document.createElement('span'); a.className = 'ayuda'; a.textContent = v[1]; b.appendChild(a);
    } else b.textContent = v;
    d.append(s, b); $('tarjetas').appendChild(d);
  });
}

const pluginCursor = {
  id: 'cursor',
  afterDraw(c) {
    const a = c.tooltip && c.tooltip.getActiveElements ? c.tooltip.getActiveElements() : [];
    if (!a.length) return;
    const x = a[0].element.x, g = c.ctx;
    g.save(); g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(x, c.chartArea.top); g.lineTo(x, c.chartArea.bottom); g.stroke(); g.restore();
  }
};

// Repeticiones que se superponen al ensayo elegido (hasta 3). La usan el
// gráfico y el PDF, así los dos muestran siempre lo mismo.
function idsSuperpuestos() {
  if (!$('comparar').checked) return [];
  const id = $('ensayo').value;
  return estado.ensayos.filter(e => String(e.id) !== String(id)).slice(0, 3).map(e => e.id);
}

async function mostrar() {
  mostrarError(null);
  const id = $('ensayo').value;
  if (!id) return;

  const principal = await obtenerEnsayo(id);
  const lista = [principal, ...await Promise.all(idsSuperpuestos().map(obtenerEnsayo))];

  pintarTarjetas(principal);
  $('titulo').textContent = principal.producto || '';
  $('btnPdf').disabled = false;

  if (!principal.puntos.length) {
    if (chart) { chart.destroy(); chart = null; }
    $('vacio').textContent = 'Este ensayo no tiene lecturas de presión guardadas';
    $('vacio').style.display = 'flex';
    actualizarUrl();
    return;
  }

  const config = GraficoPH.construir(lista, { tema: 'oscuro', responsive: true });
  config.options.plugins.zoom = {
    zoom: { drag: { enabled: true, backgroundColor: 'rgba(0,191,255,.15)' }, mode: 'x' },
    pan: { enabled: true, mode: 'x', modifierKey: 'ctrl' },
    limits: { x: { min: 'original', max: 'original' } }
  };
  config.plugins = [pluginCursor];

  if (chart) chart.destroy();
  $('vacio').style.display = 'none';
  chart = new Chart($('chart'), config);
  actualizarUrl();
}

// ---------- PDF ----------

// Se abre en una pestaña nueva, en el visor de PDF del navegador: una
// descarga forzada la bloquean Chrome/Edge/Brave porque la app es http://.
// Desde esa pestaña se guarda o se imprime con el nombre correcto.
function abrirPdf() {
  const id = $('ensayo').value;
  if (!id) return;
  const otros = idsSuperpuestos();
  const extra = otros.length ? `?superponer=${otros.join(',')}` : '';
  window.open(`/api/ph/${estado.maquina}/ensayos/${id}/pdf${extra}`, '_blank');
}

// ---------- Descarga masiva ----------
//
// El servidor permite UN lote a la vez para todos. La pantalla consulta
// su estado (/api/ph/lote) al abrir y cada 1,5 s mientras se genera, así
// que si se recarga la página o lo pidió otra persona, se ve igual.

const masiva = { lote: { estado: 'libre' }, total: 0, maximo: 3000, timerConteo: null, timerEstado: null, esAdmin: false, formulario: false };

const camposLote = ['mOp', 'mDesde', 'mHasta', 'mCanoDesde', 'mCanoHasta'];

// Selector de fecha propio (dd/mm/aaaa, en español): el <input type="date">
// nativo muestra el formato del navegador (en Edge en inglés, mes/día). El
// valor interno sigue siendo 'YYYY-MM-DD', que es lo que se manda.
const fechasLote = {};
['mDesde', 'mHasta'].forEach(id => {
  fechasLote[id] = flatpickr('#' + id, {
    locale: flatpickr.l10ns.es,
    dateFormat: 'Y-m-d',
    altInput: true,
    altFormat: 'd/m/Y',
    allowInput: true,
    onChange: () => contarDespues()
  });
});

function filtrosLote() {
  return {
    op: $('mOp').value.trim(), desde: $('mDesde').value, hasta: $('mHasta').value,
    canoDesde: $('mCanoDesde').value.trim(), canoHasta: $('mCanoHasta').value.trim()
  };
}

// Filtros y usuario los escribió otra persona: se escapan antes de mostrarlos.
const esc = t => String(t === null || t === undefined ? '' : t)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

const horaDe = ms => {
  const d = new Date(ms);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
};

function tiempoTexto(seg) {
  if (seg === null || seg === undefined) return 'calculando…';
  if (seg < 60) return `~${seg} s`;
  return `~${Math.round(seg / 60)} min`;
}

function contarDespues() {
  clearTimeout(masiva.timerConteo);
  masiva.total = 0;
  pintarLote();
  masiva.timerConteo = setTimeout(contar, 400);
}

async function contar() {
  const c = $('mConteo');
  const f = filtrosLote();
  if (!f.op && !f.desde && !f.hasta && !f.canoDesde && !f.canoHasta) {
    c.className = 'conteo'; c.textContent = 'Completá al menos un filtro.'; return;
  }
  c.className = 'conteo'; c.textContent = 'Contando ensayos…';
  try {
    const r = await api(`/api/ph/${estado.maquina}/lote/contar`, f);
    masiva.total = r.total; masiva.maximo = r.maximo;
    if (!r.total) { c.className = 'conteo mal'; c.textContent = 'No hay ensayos con esos filtros.'; }
    else if (r.total > r.maximo) { c.className = 'conteo mal'; c.textContent = `Son ${r.total} ensayos: el máximo por descarga es ${r.maximo}. Achicá los filtros.`; }
    else { c.className = 'conteo'; c.innerHTML = `Se van a generar <b>${r.total} PDF${r.total === 1 ? '' : 's'}</b>.`; }
  } catch (err) {
    masiva.total = 0; c.className = 'conteo mal'; c.textContent = err.message;
  }
  pintarLote();
}

// Dibuja botón del encabezado + modal según el estado del lote en el servidor.
function pintarLote() {
  const l = masiva.lote;
  const generando = l.estado === 'generando';
  const terminado = ['listo', 'error', 'cancelado'].includes(l.estado);
  const verResultado = generando || (terminado && !masiva.formulario);

  // Encabezado
  const b = $('btnMasiva');
  b.className = generando ? 'activo' : (l.estado === 'listo' ? 'listo' : '');
  b.textContent = generando ? `📦 Generando… ${l.porcentaje}%` : (l.estado === 'listo' ? '📦 ZIP listo' : '📦 Descarga masiva');

  // Formulario
  camposLote.forEach(id => $(id).disabled = verResultado);
  Object.values(fechasLote).forEach(fp => { fp.altInput.disabled = verResultado; });
  $('mConteo').style.display = verResultado ? 'none' : 'block';

  // Progreso / resultado
  $('mProgreso').style.display = verResultado ? 'block' : 'none';
  if (verResultado) {
    const pct = l.estado === 'listo' ? 100 : l.porcentaje;
    $('mRelleno').style.width = pct + '%';
    $('mRelleno').textContent = pct + '%';
    const quien = l.esMio ? 'vos' : esc(l.usuario);
    let texto;
    if (generando) {
      texto = `⏳ <b>Generando ${l.hecho} de ${l.total} PDFs</b> · faltan ${tiempoTexto(l.segundosRestantes)}<br>` +
              `${esc(l.filtros)} · pedido por ${quien} a las ${horaDe(l.inicio)}<br>` +
              `Podés cerrar esta ventana y seguir usando el visor: se sigue generando.`;
    } else if (l.estado === 'listo') {
      const mb = (l.bytes / 1048576).toLocaleString('es-AR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
      texto = `✅ <b>ZIP listo: ${l.total - l.errores} PDFs</b> (${mb} MB)<br>` +
              `${esc(l.filtros)} · pedido por ${quien} a las ${horaDe(l.inicio)}<br>` +
              (l.errores ? `⚠️ ${l.errores} no se pudieron generar: el detalle está en ERRORES.txt, dentro del ZIP.<br>` : '') +
              `Se puede descargar hasta las ${horaDe(l.venceEn)}; después se borra solo.<br>` +
              `ℹ️ El navegador puede avisar "descarga no segura" porque el sitio es http. Es normal: elegí <b>Conservar</b>.`;
    } else if (l.estado === 'cancelado') {
      texto = `Generación cancelada (se habían hecho ${l.hecho} de ${l.total}).`;
    } else {
      texto = `❌ ${esc(l.error || 'Falló la generación')}`;
    }
    $('mDetalle').innerHTML = texto;
  }

  // Botones
  const g = $('mGenerar');
  if (generando) {
    g.disabled = true; g.textContent = 'Generando…';
  } else if (l.estado === 'listo' && !masiva.formulario) {
    g.disabled = false; g.textContent = '⬇ Descargar ZIP';
  } else {
    g.textContent = 'GENERAR PDFs';
    g.disabled = !(masiva.total > 0 && masiva.total <= masiva.maximo) || g.dataset.enviando === '1';
  }
  $('mCancelar').style.display = generando && (l.esMio || masiva.esAdmin) ? '' : 'none';

  // Con el formulario a la vista, un ZIP ya terminado se ofrece arriba
  // para que no se pierda de vista.
  const u = $('mUltimo');
  if (l.estado === 'listo' && masiva.formulario) {
    u.innerHTML = `📦 Último ZIP listo: ${esc(l.filtros)} (${l.total - l.errores} PDFs, pedido por ${l.esMio ? 'vos' : esc(l.usuario)}) — ` +
                  `<a href="/api/ph/lote/zip">⬇ Descargar</a>`;
    u.style.display = 'block';
  } else {
    u.style.display = 'none';
  }
}

async function actualizarLote() {
  try {
    masiva.lote = await api('/api/ph/lote');
  } catch (err) {
    return;   // un fallo de red puntual: se reintenta en el próximo ciclo
  }
  pintarLote();
  clearTimeout(masiva.timerEstado);
  if (masiva.lote.estado === 'generando') masiva.timerEstado = setTimeout(actualizarLote, 1500);
}

async function generarLote() {
  const g = $('mGenerar');
  if (masiva.lote.estado === 'listo' && !masiva.formulario) {
    window.location.href = '/api/ph/lote/zip';
    return;
  }
  // Se bloquea en el mismo clic, antes de hablar con el servidor: un doble
  // clic no puede mandar dos pedidos.
  if (g.disabled) return;
  g.disabled = true; g.dataset.enviando = '1'; g.textContent = 'Iniciando…';
  try {
    masiva.lote = await api(`/api/ph/${estado.maquina}/lote`, filtrosLote());
    masiva.formulario = false;
  } catch (err) {
    if (err.datos && err.datos.lote) { masiva.lote = err.datos.lote; masiva.formulario = false; }
    else { $('mConteo').className = 'conteo mal'; $('mConteo').textContent = err.message; }
  } finally {
    g.dataset.enviando = '';
  }
  pintarLote();
  if (masiva.lote.estado === 'generando') actualizarLote();
}

async function cancelarLote() {
  if (!confirm('¿Cancelar la generación? Lo generado hasta ahora se descarta.')) return;
  try { masiva.lote = await api('/api/ph/lote/cancelar', {}); } catch (err) { alert(err.message); }
  actualizarLote();
}

// Al abrir, el formulario arranca limpio (con la OP de la pantalla). Si hay
// un lote generándose, pintarLote() igual lo bloquea y muestra el progreso.
function abrirMasiva() {
  masiva.formulario = true;
  masiva.total = 0;
  camposLote.forEach(id => $(id).value = '');
  Object.values(fechasLote).forEach(fp => fp.clear(false));
  $('mOp').value = $('op').value.trim();
  $('mMaquina').textContent = `Máquina ${$('maquina').selectedOptions[0] ? $('maquina').selectedOptions[0].textContent : ''} · completá al menos un filtro. Se genera un ZIP con un PDF por ensayo.`;
  $('fondo').classList.add('abierto');
  actualizarLote();
  contar();
}

$('btnMasiva').addEventListener('click', abrirMasiva);
$('mCerrar').addEventListener('click', () => $('fondo').classList.remove('abierto'));
$('fondo').addEventListener('click', e => { if (e.target === $('fondo')) $('fondo').classList.remove('abierto'); });
$('mGenerar').addEventListener('click', generarLote);
$('mCancelar').addEventListener('click', cancelarLote);
camposLote.forEach(id => $(id).addEventListener('input', contarDespues));

// ---------- Eventos ----------

const conAviso = fn => async (...args) => { try { await fn(...args); } catch (err) { mostrarError(err); } };

$('maquina').addEventListener('change', conAviso(async () => {
  estado.maquina = $('maquina').value; $('op').value = '';
  limpiarDesde(1); await cargarOps(); actualizarUrl();
}));
$('op').addEventListener('change', conAviso(() => cargarCanos()));
$('op').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('cano').addEventListener('change', conAviso(() => cargarEnsayos()));
$('ensayo').addEventListener('change', conAviso(mostrar));
$('comparar').addEventListener('change', conAviso(mostrar));
$('btnReset').addEventListener('click', () => chart && chart.resetZoom());
$('btnPdf').addEventListener('click', abrirPdf);

// Arranque: respeta ?maquina=&op=&cano=&ensayo= para poder compartir un link.
conAviso(async () => {
  const inicial = Object.fromEntries(new URLSearchParams(location.search));
  api('/api/me').then(yo => { masiva.esAdmin = !!yo.esAdmin; pintarLote(); }).catch(() => {});
  actualizarLote();
  await cargarMaquinas(inicial);
  await cargarOps();
  if (inicial.op) {
    $('op').value = inicial.op;
    await cargarCanos(inicial.cano);
    if (inicial.ensayo && $('ensayo').value !== inicial.ensayo) await cargarEnsayos(inicial.ensayo);
  }
})();
</script>
