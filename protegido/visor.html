<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Visor de Ensayos</title>

<style>

body{
    font-family:Arial;
    background:#111;
    color:white;
    padding:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #333;
    padding:10px;
}

th{
    background:#222;
}

input{
    padding:8px;
    margin-right:10px;
    background:#222;
    color:white;
    border:1px solid #444;
}

button{
    padding:8px 15px;
    cursor:pointer;
}

a{
    color:#00bfff;
}

.acciones{
    white-space:nowrap;
}

.acciones button, .acciones a{
    margin-right:8px;
}

.btn-pdf{
    background:#28a745;
    color:white;
    border:none;
    border-radius:4px;
    font-weight:bold;
}

.btn-pdf:disabled{
    opacity:.6;
    cursor:wait;
}

.btn-grafico{
    background:#007bff;
    color:white;
    border:none;
    border-radius:4px;
    font-weight:bold;
}

#panel-grafico{
    display:none;
    background:#1b1b1b;
    border:1px solid #333;
    border-radius:8px;
    padding:15px;
    margin-top:20px;
}

#panel-grafico .cabecera{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

#grafico-info{
    margin:10px 0;
    color:#bbb;
    font-size:14px;
}

#grafico-info span{
    margin-right:18px;
}

#grafico-contenedor{
    position:relative;
    height:380px;
}

#msg{
    margin-top:10px;
    color:#dc3545;
    font-size:14px;
}

select{
    padding:8px;
    margin-right:10px;
    background:#222;
    color:white;
    border:1px solid #444;
}

.chip{
    display:inline-block;
    padding:3px 10px;
    border-radius:10px;
    font-size:12px;
    font-weight:bold;
    white-space:nowrap;
    cursor:help;
}

.chip.verde{ background:#1e5a2e; color:#9be3b0; }
.chip.ambar{ background:#6b4a10; color:#ffd58a; }
.chip.rojo{ background:#6b1f27; color:#ffb3ba; }
.chip.gris{ background:#3a3a3a; color:#bbb; }

.aviso{
    margin-top:12px;
    padding:10px 14px;
    border-radius:6px;
    font-size:14px;
    border-left:4px solid #555;
    background:#1b1b1b;
}

.aviso.azul{ border-left-color:#007bff; }
.aviso.ambar{ border-left-color:#ffc107; }
.aviso.rojo{ border-left-color:#dc3545; }
.aviso.verde{ border-left-color:#28a745; color:#9be3b0; }

.aviso button{
    margin-left:10px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:4px;
    font-weight:bold;
}

.aviso button:disabled{
    opacity:.6;
    cursor:wait;
}

.aviso small{
    color:#999;
}

</style>

<script src="/ph-assets/chart.min.js"></script>

</head>

<body>

<a href="/" style="display:inline-block; margin-bottom:10px; color:#00bfff; text-decoration:none; font-weight:bold;">&larr; Volver al menú</a>

<h1>Visor de Ensayos</h1>

<div>

    <input id="filtroOP" placeholder="OP">

    <input id="filtroCano" placeholder="Caño">

    <input id="filtroFecha" type="date">

    <select id="filtroEstado" onchange="buscar()">
        <option value="">Todos los estados</option>
        <option value="pendiente">Pendientes de subir a SQL</option>
        <option value="en_sql">Ya subidos a SQL</option>
        <option value="interrumpido">Interrumpidos</option>
    </select>

    <button onclick="buscar()">
        Buscar
    </button>

</div>

<div id="msg"></div>

<div id="resumen-sync"></div>

<div id="panel-grafico">

    <div class="cabecera">
        <strong id="grafico-titulo"></strong>
        <span>
            <button id="btn-grafico-pdf" class="btn-pdf" onclick="descargarPdf(ensayoAbierto, this)">Generar PDF</button>
            <button onclick="cerrarGrafico()">Cerrar</button>
        </span>
    </div>

    <div id="grafico-info"></div>

    <div id="grafico-contenedor">
        <canvas id="grafico"></canvas>
    </div>

</div>

<table>

<thead>
<tr>
    <th>Fecha</th>
    <th>OP</th>
    <th>Caño</th>
    <th>Muestras</th>
    <th>Estado</th>
    <th>Acciones</th>
</tr>
</thead>

<tbody id="tabla">

</tbody>

</table>

<script>

// Si la sesión venció, volvemos al login en vez de quedar con la pantalla rota
(function () {
    const fetchOriginal = window.fetch;
    window.fetch = async function (...args) {
        const res = await fetchOriginal(...args);
        if (res.status === 401) {
            window.location.href = '/';
        }
        return res;
    };
})();

let ensayos = [];
let ensayoAbierto = null;
let grafico = null;
let configuradoSql = null;
let ultimoResumen = null;

function esc(valor){
    return String(valor === null || valor === undefined ? '' : valor)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function mostrarMensaje(texto){
    document.getElementById('msg').innerText = texto || '';
}

async function cargarEnsayos(){

    mostrarMensaje('');

    // PDFs que hay en la carpeta (todos los ensayos, incluso los viejos)
    // y ensayos con las muestras guardadas en la base (los nuevos).
    const [resArchivos, resDatos] = await Promise.all([
        fetch('/api/ensayos'),
        fetch('/api/ensayos-datos')
    ]);

    const archivos = resArchivos.ok ? await resArchivos.json() : [];
    const datos = resDatos.ok ? await resDatos.json() : [];

    if (!resArchivos.ok || !resDatos.ok) {
        mostrarMensaje('No se pudo cargar una parte del listado de ensayos.');
    }

    const datosPorArchivo = new Map(
        datos.filter(d => d.archivo).map(d => [d.archivo, d])
    );

    const idsUsados = new Set();

    const filas = archivos.map(a => {

        const d = datosPorArchivo.get(a.archivo);

        if (d) {
            idsUsados.add(d.id);
        }

        return {
            fecha: d ? d.fecha : a.fecha,
            op: a.op,
            cano: a.cano,
            archivo: a.archivo,
            datosId: d ? d.id : null,
            cantidad: d ? d.cantidad : null,
            estado: d ? d.estado : null,
            sincronizado: d ? d.sincronizado : null
        };
    });

    // Ensayos guardados cuyo PDF no existe (falló al generarse o se borró)
    datos.filter(d => !idsUsados.has(d.id)).forEach(d => {
        filas.push({
            fecha: d.fecha,
            op: d.op,
            cano: d.cano,
            archivo: null,
            datosId: d.id,
            cantidad: d.cantidad,
            estado: d.estado,
            sincronizado: d.sincronizado
        });
    });

    filas.sort((a, b) => b.fecha.localeCompare(a.fecha));

    ensayos = filas;

    // se vuelven a aplicar los filtros que haya puesto la persona
    buscar();
}

// Estado de cada ensayo respecto del SQL Server:
//   pdf          ensayo anterior al guardado de muestras (solo tiene el PDF)
//   interrumpido el programa se reinició en pleno ensayo (quedaron las muestras tomadas)
//   en_sql       ya está subido
//   pendiente    guardado en el programa, todavía sin subir
function claveEstado(e){

    if (e.datosId === null) return 'pdf';
    if (e.estado === 'interrumpido') return 'interrumpido';
    if (e.sincronizado) return 'en_sql';

    return 'pendiente';
}

function chipEstado(e){

    switch (claveEstado(e)) {

        case 'pdf':
            return '<span class="chip gris" title="Ensayo anterior al guardado de muestras: solo tiene el PDF">Solo PDF</span>';

        case 'interrumpido':
            return '<span class="chip rojo" title="El programa se reinició durante este ensayo. Quedaron guardadas las muestras tomadas hasta ese momento. No se sube a SQL Server porque está incompleto.">Interrumpido</span>';

        case 'en_sql':
            return '<span class="chip verde" title="Ya está guardado en el SQL Server">En SQL Server</span>';

        default:
            return configuradoSql === false
                ? '<span class="chip gris" title="El SQL Server no está configurado en este servidor: el ensayo queda solo en el programa">Solo local</span>'
                : '<span class="chip ambar" title="Todavía no se subió al SQL Server. Se reintenta solo cada 5 minutos.">Pendiente de SQL</span>';
    }
}

function mostrar(lista){

    const tabla =
        document.getElementById('tabla');

    tabla.innerHTML = lista.map(e => {

        const acciones = [];

        if (e.datosId !== null) {
            acciones.push(`<button class="btn-grafico" onclick="verGrafico(${e.datosId})">Ver gráfico</button>`);
            acciones.push(`<button class="btn-pdf" onclick="descargarPdf(${e.datosId}, this)">Generar PDF</button>`);
        }

        if (e.archivo) {
            acciones.push(`<a href="/pdfs/${encodeURIComponent(e.archivo)}" target="_blank">Abrir PDF</a>`);
        }

        return `
        <tr>
            <td>${esc(e.fecha)}</td>
            <td>${esc(e.op)}</td>
            <td>${esc(e.cano)}</td>
            <td>${e.cantidad === null ? '-' : esc(e.cantidad)}</td>
            <td>${chipEstado(e)}</td>
            <td class="acciones">${acciones.join('')}</td>
        </tr>
        `;
    }).join('');
}

function buscar(){

    const op =
        document.getElementById('filtroOP')
        .value
        .trim();

    const cano =
        document.getElementById('filtroCano')
        .value
        .trim();

    const fecha =
        document.getElementById('filtroFecha')
        .value;

    const estadoFiltro =
        document.getElementById('filtroEstado')
        .value;

    const filtrado =
        ensayos.filter(e=>{

            let ok = true;

            if(op){
                ok =
                    ok &&
                    String(e.op)
                    .includes(op);
            }

            if(cano){
                ok =
                    ok &&
                    String(e.cano)
                    .includes(cano);
            }

            if(fecha){
                ok =
                    ok &&
                    e.fecha.startsWith(fecha);
            }

            if(estadoFiltro){
                ok =
                    ok &&
                    claveEstado(e) === estadoFiltro;
            }

            return ok;
        });

    mostrar(filtrado);
}

async function verGrafico(id){

    mostrarMensaje('');

    const res = await fetch('/api/ensayos-datos/' + id);

    if (!res.ok) {
        mostrarMensaje('No se pudieron cargar los datos del ensayo.');
        return;
    }

    const ensayo = await res.json();
    const muestras = ensayo.muestras;

    ensayoAbierto = id;

    const maximo = Math.max(...muestras);
    const minimo = Math.min(...muestras);
    const promedio = muestras.reduce((a, b) => a + b, 0) / muestras.length;

    document.getElementById('grafico-titulo').innerText =
        `Ensayo OP ${ensayo.op} - Caño ${ensayo.cano}`;

    document.getElementById('grafico-info').innerHTML = `
        <span>Fecha: <b>${esc(ensayo.fecha)}</b></span>
        <span>Muestras: <b>${muestras.length}</b></span>
        <span>Máx: <b>${maximo}</b></span>
        <span>Mín: <b>${minimo}</b></span>
        <span>Promedio: <b>${promedio.toFixed(1)}</b></span>
    `;

    document.getElementById('panel-grafico').style.display = 'block';

    if (grafico) {
        grafico.destroy();
    }

    grafico = new Chart(document.getElementById('grafico'), {
        type: 'line',
        data: {
            labels: muestras.map((_, i) => i),
            datasets: [{
                label: 'Presión',
                data: muestras,
                borderColor: '#00bfff',
                backgroundColor: '#00bfff',
                borderWidth: 2,
                tension: 0.1,
                pointRadius: muestras.length > 150 ? 0 : 3
            }]
        },
        options: {
            animation: false,
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: { legend: { display: false } },
            scales: {
                x: {
                    title: { display: true, text: 'Tiempo (s)', color: '#ccc' },
                    ticks: { color: '#ccc', maxTicksLimit: 20 },
                    grid: { color: '#333' }
                },
                y: {
                    title: { display: true, text: 'Presión', color: '#ccc' },
                    ticks: { color: '#ccc' },
                    grid: { color: '#333' }
                }
            }
        }
    });

    document.getElementById('panel-grafico').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function cerrarGrafico(){

    document.getElementById('panel-grafico').style.display = 'none';

    if (grafico) {
        grafico.destroy();
        grafico = null;
    }

    ensayoAbierto = null;
}

async function descargarPdf(id, boton){

    if (id === null || id === undefined) {
        return;
    }

    mostrarMensaje('');

    const textoOriginal = boton.innerText;
    boton.disabled = true;
    boton.innerText = 'Generando...';

    try {

        const res = await fetch('/api/ensayos-datos/' + id + '/pdf');

        if (!res.ok) {
            mostrarMensaje('No se pudo generar el PDF: ' + await res.text());
            return;
        }

        const disposicion = res.headers.get('Content-Disposition') || '';
        const coincidencia = disposicion.match(/filename="([^"]+)"/);

        const url = URL.createObjectURL(await res.blob());

        const enlace = document.createElement('a');
        enlace.href = url;
        enlace.download = coincidencia ? coincidencia[1] : 'ensayo.pdf';
        document.body.appendChild(enlace);
        enlace.click();
        enlace.remove();

        URL.revokeObjectURL(url);

    } catch (err) {

        mostrarMensaje('No se pudo generar el PDF.');

    } finally {

        boton.disabled = false;
        boton.innerText = textoOriginal;
    }
}

// ------------------------------------------------------
// Resumen: ensayo en curso y estado de la subida a SQL Server
// ------------------------------------------------------

function textoEdad(ms){

    const s = Math.max(0, Math.round(ms / 1000));

    return s < 60 ? `${s} s` : s < 3600 ? `${Math.floor(s / 60)} min` : `${Math.floor(s / 3600)} h ${Math.floor(s % 3600 / 60)} min`;
}

function mostrarResumen(r){

    const avisos = [];

    if (r.enCurso) {
        avisos.push(
            `<div class="aviso azul"><b>Ensayo en curso:</b> OP ${esc(r.enCurso.op)} · caño ${esc(r.enCurso.cano)} · ` +
            `${esc(r.enCurso.cantidad)} muestras guardadas <small>(último dato hace ${textoEdad(r.ahora - r.enCurso.actualizado)})</small></div>`
        );
    }

    if (!r.configurado && r.pendientes > 0) {
        avisos.push(
            `<div class="aviso">Los ensayos quedan solo en el servidor del programa: el SQL Server no está configurado en este servidor ` +
            `(<b>${esc(r.pendientes)}</b> sin subir).</div>`
        );
    } else if (r.pendientes > 0) {
        avisos.push(
            `<div class="aviso ambar"><b>${esc(r.pendientes)}</b> ensayo(s) todavía no subieron al SQL Server` +
            (r.masAntiguo ? ` <small>(el más viejo: ${esc(r.masAntiguo)})</small>` : '') +
            `. Están guardados y se reintenta solo cada 5 minutos.` +
            `<button id="btn-subir" onclick="subirPendientes(this)">Subir pendientes ahora</button>` +
            (r.ultimoError ? `<br><small>Último error: ${esc(r.ultimoError)}</small>` : '') + `</div>`
        );
    } else if (r.configurado && r.total > 0) {
        avisos.push(`<div class="aviso verde">Todos los ensayos con muestras ya están subidos al SQL Server.</div>`);
    }

    if (r.interrumpidos > 0) {
        avisos.push(
            `<div class="aviso rojo"><b>${esc(r.interrumpidos)}</b> ensayo(s) quedaron interrumpidos porque el programa se reinició en pleno ensayo ` +
            `(figuran como "Interrumpido"): tienen las muestras tomadas hasta ese momento y no se suben al SQL Server.</div>`
        );
    }

    document.getElementById('resumen-sync').innerHTML = avisos.join('');
}

async function cargarResumen(){

    try {

        const res = await fetch('/api/ensayos-datos/resumen');

        if (!res.ok) return;

        const r = await res.json();

        configuradoSql = r.configurado;

        const cambio = ultimoResumen !== null && (
            r.total !== ultimoResumen.total ||
            r.pendientes !== ultimoResumen.pendientes ||
            r.interrumpidos !== ultimoResumen.interrumpidos ||
            r.configurado !== ultimoResumen.configurado
        );

        const primera = ultimoResumen === null;

        ultimoResumen = r;

        mostrarResumen(r);

        // si apareció un ensayo nuevo o cambió su estado, se actualiza la lista
        if (cambio) {
            await cargarEnsayos();
        } else if (primera) {
            buscar();   // ya hay lista: solo se redibuja con lo que se supo del SQL (etiquetas)
        }

    } catch (err) {
        // sin conexión momentánea: se reintenta en el próximo ciclo
    }
}

async function subirPendientes(boton){

    mostrarMensaje('');

    boton.disabled = true;
    boton.innerText = 'Subiendo...';

    let mensaje = '';

    try {

        const res = await fetch('/api/ensayos-datos/sincronizar', { method: 'POST' });

        if (!res.ok) {

            mensaje = 'No se pudo subir los ensayos pendientes.';

        } else {

            const r = await res.json();

            if (r.error && r.subidos === 0) {
                mensaje = 'No se pudieron subir: ' + r.error;
            }
        }

    } catch (err) {

        mensaje = 'No se pudo subir los ensayos pendientes.';
    }

    // Se actualiza la lista y el resumen, y recién después se muestra el mensaje
    // (si no, al recargar la lista se borraría)
    await cargarResumen();
    await cargarEnsayos();

    if (mensaje) {
        mostrarMensaje(mensaje);
    }
}

cargarEnsayos().then(cargarResumen);

setInterval(() => { if (!document.hidden) cargarResumen(); }, 8000);

</script>

</body>
</html>
