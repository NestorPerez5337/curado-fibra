<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro de Cambios</title>
<style>
    body { font-family: Arial, sans-serif; background:#111; color:white; padding:20px; }
    a.volver { color:#00bfff; text-decoration:none; font-weight:bold; display:inline-block; margin-bottom:10px; }
    h1 { margin-top:0; color:#007bff; }
    p.ayuda { color:#888; font-size:13px; margin-top:-8px; }
    .filtros { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:15px; }
    label { display:block; font-size:12px; color:#aaa; margin-bottom:4px; }
    select, input[type=date], input[type=text] { padding:8px; background:#222; color:white; border:1px solid #444; }
    button { padding:8px 15px; cursor:pointer; background:#007bff; color:white; border:none; border-radius:4px; font-weight:bold; }
    table { width:100%; border-collapse:collapse; margin-top:20px; }
    th, td { border:1px solid #333; padding:10px; text-align:left; font-size:13px; vertical-align:top; }
    th { background:#222; }
    .modulo { padding:2px 8px; border-radius:10px; font-size:11px; font-weight:bold; }
    .modulo-devanadoras { background:#0056b3; }
    .modulo-compresores { background:#5a3d00; color:#ffc107; }
    .modulo-usuarios { background:#4a1f1f; color:#ff6b6b; }
    .modulo-sistema { background:#1f2d1f; color:#28a745; }
    .detalle { color:#888; font-size:11px; white-space:pre-wrap; word-break:break-all; max-width:320px; }
    .usuario { font-weight:bold; color:#28a745; }
</style>
</head>
<body>

<a class="volver" href="/">&larr; Volver al menú</a>
<h1>Registro de Cambios</h1>
<p class="ayuda">Solo se registran acciones que modifican algo (crear, editar, eliminar, setear un horario, etc). Ver una pantalla o un gráfico no queda registrado.</p>

<div class="filtros">
    <div>
        <label>Usuario</label>
        <input type="text" id="filtroUsuario" placeholder="Todos">
    </div>
    <div>
        <label>Módulo</label>
        <select id="filtroModulo">
            <option value="">Todos</option>
            <option value="devanadoras">Devanadoras</option>
            <option value="compresores">Compresores</option>
            <option value="usuarios">Usuarios</option>
            <option value="sistema">Sistema</option>
        </select>
    </div>
    <div>
        <label>Desde</label>
        <input type="date" id="filtroDesde">
    </div>
    <div>
        <label>Hasta</label>
        <input type="date" id="filtroHasta">
    </div>
    <button onclick="buscar()">Buscar</button>
</div>

<table>
<thead>
<tr>
    <th>Fecha y hora</th>
    <th>Usuario</th>
    <th>Módulo</th>
    <th>Acción</th>
    <th>Detalle</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

<script>

// Si la sesión venció, volvemos al login en vez de quedar con la pantalla rota
(function () {
    const fetchOriginal = window.fetch;
    window.fetch = async function (...args) {
        const res = await fetchOriginal(...args);
        if (res.status === 401) {
            window.location.href = '/';
        }
        return res;
    };
})();

function detalleLegible(detalle) {
    if (!detalle) return '';
    try {
        return JSON.stringify(detalle, null, 0);
    } catch {
        return String(detalle);
    }
}

async function buscar() {
    const usuario = document.getElementById('filtroUsuario').value.trim();
    const modulo = document.getElementById('filtroModulo').value;
    const desde = document.getElementById('filtroDesde').value;
    const hasta = document.getElementById('filtroHasta').value;

    const params = new URLSearchParams();
    if (usuario) params.set('usuario', usuario);
    if (modulo) params.set('modulo', modulo);
    if (desde) params.set('desde', desde);
    if (hasta) params.set('hasta', hasta);

    const res = await fetch('/api/log?' + params.toString());
    const eventos = res.ok ? await res.json() : [];

    const tbody = document.getElementById('tabla');
    tbody.innerHTML = '';

    if (eventos.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#888;">Sin cambios registrados todavía.</td></tr>';
        return;
    }

    eventos.forEach(e => {
        tbody.innerHTML += `
        <tr>
            <td>${e.fechaHora}</td>
            <td class="usuario">${e.usuario}</td>
            <td><span class="modulo modulo-${e.modulo}">${e.modulo}</span></td>
            <td>${e.accion}</td>
            <td class="detalle">${detalleLegible(e.detalle)}</td>
        </tr>
        `;
    });
}

buscar();

</script>
</body>
</html>
